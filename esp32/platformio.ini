/*
 * Mesa Vibratoria Sísmica v3.0 - CON PORTAL WiFi
 * Si no hay WiFi configurado, crea AP "SeismicConfig"
 */

#include <WiFi.h>
#include <WebServer.h>
#include <Firebase_ESP_Client.h>
#include <Preferences.h>
#include <NTPClient.h>
#include <WiFiUdp.h>

// Firebase
#define FIREBASE_HOST "seismic-simulator-default-rtdb.firebaseio.com"
#define FIREBASE_AUTH "sa0"
#define DEVICE_ID "LAB_01"

// Motor
#define STEP 25
#define DIR 26
#define EN 27

FirebaseData fbdo;
FirebaseAuth auth;
FirebaseConfig config;
Preferences prefs;
WiFiUDP ntpUDP;
NTPClient timeClient(ntpUDP, "pool.ntp.org", 0, 60000);
WebServer server(80);

// Variables
bool isRunning = false;
float frequency = 2.0;
float amplitude = 50.0;
int waveformType = 0; // 0=sine, 1=p-wave, 2=s-wave, 3=complete, 4=aftershocks, 5=near, 6=far
unsigned long startTime = 0;
unsigned long lastUpdateTime = 0;
bool wifiConfigMode = false;

void setup() {
  Serial.begin(115200);
  delay(1000);
  Serial.println(F("\n=== MESA SÍSMICA v3.0 ==="));
  
  // FORZAR ESTADO INICIAL
  isRunning = false;
  waveformType = 0;
  
  pinMode(STEP, OUTPUT);
  pinMode(DIR, OUTPUT);
  pinMode(EN, OUTPUT);
  digitalWrite(EN, HIGH); // Motor OFF
  digitalWrite(STEP, LOW);
  digitalWrite(DIR, LOW);
  
  Serial.println(F("Motor: DESHABILITADO"));
  Serial.print(F("isRunning: "));
  Serial.println(isRunning);
  
  // Intentar conectar a WiFi guardado
  if (!connectToWiFi()) {
    // Si falla, iniciar portal de configuración
    startConfigPortal();
    return;
  }
  
  // Inicializar Firebase
  initFirebase();
  
  Serial.println(F("✅ Listo - ESPERANDO START"));
  Serial.println(F("Estado inicial: DETENIDO"));
}

void loop() {
  if (wifiConfigMode) {
    server.handleClient();
    return;
  }
  
  timeClient.update();
  checkCommands();
  
  if (isRunning) {
    if (waveformType == 99) {
      // Modo realtime: leer amplitud de Firebase
      runRealtimeMode();
    } else {
      // Modo generación local
      runSimulation();
    }
  }
  
  static unsigned long lastStatus = 0;
  if (millis() - lastStatus > 2000) {
    updateStatus();
    lastStatus = millis();
  }
}

bool connectToWiFi() {
  prefs.begin("seismic", false);
  String ssid = prefs.getString("ssid", "");
  String pass = prefs.getString("pass", "");
  
  if (ssid.length() == 0) {
    Serial.println(F("❌ Sin WiFi configurado"));
    return false;
  }
  
  Serial.print(F("📡 Conectando a: "));
  Serial.println(ssid);
  
  WiFi.begin(ssid.c_str(), pass.c_str());
  
  int attempts = 0;
  while (WiFi.status() != WL_CONNECTED && attempts < 20) {
    delay(500);
    Serial.print(F("."));
    attempts++;
  }
  
  if (WiFi.status() == WL_CONNECTED) {
    Serial.println(F("\n✅ WiFi OK"));
    Serial.print(F("📡 IP: "));
    Serial.println(WiFi.localIP());
    return true;
  } else {
    Serial.println(F("\n❌ WiFi Error"));
    return false;
  }
}

void startConfigPortal() {
  Serial.println(F("\n🔧 MODO CONFIGURACIÓN"));
  Serial.println(F("Creando AP: SeismicConfig"));
  
  wifiConfigMode = true;
  WiFi.mode(WIFI_AP);
  WiFi.softAP("SeismicConfig", "12345678");
  
  Serial.print(F("📡 IP del AP: "));
  Serial.println(WiFi.softAPIP());
  Serial.println(F("Conecta a 'SeismicConfig' (pass: 12345678)"));
  Serial.println(F("Luego abre: http://192.168.4.1"));
  
  // Página de configuración
  server.on("/", HTTP_GET, []() {
    String html = "<!DOCTYPE html><html><head><meta charset='UTF-8'>";
    html += "<meta name='viewport' content='width=device-width,initial-scale=1'>";
    html += "<title>Configurar WiFi</title>";
    html += "<style>body{font-family:Arial;max-width:400px;margin:50px auto;padding:20px;}";
    html += "input{width:100%;padding:10px;margin:10px 0;box-sizing:border-box;}";
    html += "button{width:100%;padding:12px;background:#4CAF50;color:white;border:none;cursor:pointer;font-size:16px;}";
    html += "button:hover{background:#45a049;}</style></head><body>";
    html += "<h2>🌊 Mesa Sísmica</h2>";
    html += "<h3>Configuración WiFi</h3>";
    html += "<form action='/save' method='POST'>";
    html += "<label>Red WiFi:</label><input name='ssid' placeholder='Nombre de la red' required>";
    html += "<label>Contraseña:</label><input type='password' name='pass' placeholder='Contraseña WiFi' required>";
    html += "<button type='submit'>💾 Guardar y Conectar</button>";
    html += "</form></body></html>";
    
    server.send(200, "text/html", html);
  });
  
  server.on("/save", HTTP_POST, []() {
    String ssid = server.arg("ssid");
    String pass = server.arg("pass");
    
    Serial.println(F("\n📝 Guardando WiFi..."));
    Serial.print(F("SSID: "));
    Serial.println(ssid);
    
    prefs.putString("ssid", ssid);
    prefs.putString("pass", pass);
    
    String html = "<!DOCTYPE html><html><head><meta charset='UTF-8'>";
    html += "<meta name='viewport' content='width=device-width,initial-scale=1'>";
    html += "<style>body{font-family:Arial;text-align:center;padding:50px;}</style></head><body>";
    html += "<h2>✅ WiFi Guardado</h2>";
    html += "<p>El ESP32 se reiniciará en 3 segundos...</p>";
    html += "<p>Conectándose a: <strong>" + ssid + "</strong></p>";
    html += "</body></html>";
    
    server.send(200, "text/html", html);
    
    delay(3000);
    ESP.restart();
  });
  
  server.begin();
  Serial.println(F("✅ Servidor web iniciado"));
}

void initFirebase() {
  timeClient.begin();
  timeClient.update();
  
  config.host = FIREBASE_HOST;
  config.signer.tokens.legacy_token = FIREBASE_AUTH;
  Firebase.begin(&config, &auth);
  Firebase.reconnectWiFi(true);
  
  Serial.println(F("🔥 Firebase..."));
  delay(1000);
  
  if (Firebase.ready()) {
    Serial.println(F("✅ Firebase OK"));
    registerDevice();
  } else {
    Serial.println(F("❌ Firebase Error"));
  }
}

void registerDevice() {
  String path = "/devices/" + String(DEVICE_ID) + "/status";
  
  // Forzar estado inicial limpio
  isRunning = false;
  digitalWrite(EN, HIGH); // Motor OFF
  
  FirebaseJson json;
  json.set("online", true);
  json.set("isRunning", false);  // FORZAR false
  json.set("progress", 0);
  json.set("lastSeen", (int)timeClient.getEpochTime());
  json.set("ip", WiFi.localIP().toString());
  json.set("version", "v3.0-PORTAL");
  
  if (Firebase.RTDB.setJSON(&fbdo, path.c_str(), &json)) {
    Serial.println(F("✅ Registrado (Estado: DETENIDO)"));
  } else {
    Serial.println(F("❌ Error registro"));
  }
  
  // Limpiar comando anterior
  String cmdPath = "/devices/" + String(DEVICE_ID) + "/commands";
  FirebaseJson cmdJson;
  cmdJson.set("action", "READY");
  cmdJson.set("timestamp", 0);
  Firebase.RTDB.setJSON(&fbdo, cmdPath.c_str(), &cmdJson);
}

void checkCommands() {
  static unsigned long lastCheck = 0;
  if (millis() - lastCheck < 1000) return;
  lastCheck = millis();
  
  String path = "/devices/" + String(DEVICE_ID) + "/commands";
  
  if (Firebase.RTDB.getJSON(&fbdo, path.c_str())) {
    FirebaseJson &json = fbdo.jsonObject();
    FirebaseJsonData data;
    
    // DEBUG: Ver qué hay en commands
    String jsonStr;
    json.toString(jsonStr, true);
    if (jsonStr.length() > 10) {
      Serial.print(F("📥 Commands: "));
      Serial.println(jsonStr);
    }
    
    json.get(data, "action");
    String action = data.stringValue;
    
    Serial.print(F("Action: "));
    Serial.print(action);
    Serial.print(F(" | Running: "));
    Serial.println(isRunning);
    
    if (action == "START") {
      if (!isRunning) {
        json.get(data, "frequency");
        if (data.success) frequency = data.floatValue;
        
        json.get(data, "amplitude");
        if (data.success) amplitude = data.floatValue;
        
        json.get(data, "waveformType");
        if (data.success) waveformType = data.intValue;
        
        Serial.println(F("▶️ START"));
        Serial.print(F("Freq: "));
        Serial.print(frequency);
        Serial.print(F("Hz, Amp: "));
        Serial.print(amplitude);
        Serial.print(F("mm, Type: "));
        Serial.println(waveformType);
        
        startSimulation();
      } else {
        Serial.println(F("⚠️ Ya está corriendo"));
      }
    } 
    else if (action == "PAUSE") {
      Serial.println(F("⏸️ PAUSE"));
      stopSimulation();
    }
    else if (action == "STOP") {
      Serial.println(F("⏹️ STOP"));
      stopSimulation();
      
      // RESET AGRESIVO DEL ESTADO
      isRunning = false;
      digitalWrite(EN, HIGH);
      Serial.println(F("🔄 Estado reseteado completamente"));
    }
  } else {
    Serial.print(F("⚠️ Error: "));
    Serial.println(fbdo.errorReason());
  }
}

void startSimulation() {
  isRunning = true;
  startTime = millis();
  digitalWrite(EN, LOW);
  updateStatus();
}

void stopSimulation() {
  isRunning = false;
  digitalWrite(EN, HIGH);
  updateStatus();
}

void runSimulation() {
  unsigned long now = millis();
  float elapsedTime = (now - startTime) / 1000.0;
  
  float currentAmplitude = 0;
  
  // Generar según tipo de onda
  switch (waveformType) {
    case 1: // P-Wave (Onda Primaria)
      {
        float freq = 8.0;
        float decay = exp(-elapsedTime * 2.0);
        currentAmplitude = amplitude * sin(2 * PI * freq * elapsedTime) * decay;
      }
      break;
      
    case 2: // S-Wave (Onda Secundaria)
      {
        float freq = 4.0;
        float decay = exp(-elapsedTime * 1.0);
        currentAmplitude = amplitude * sin(2 * PI * freq * elapsedTime) * decay;
      }
      break;
      
    case 3: // Sismo Completo (P + S + Surface)
      {
        if (elapsedTime < 2.0) {
          // P-Wave
          float freq = 8.0;
          float decay = exp(-elapsedTime * 2.0);
          currentAmplitude = amplitude * 0.3 * sin(2 * PI * freq * elapsedTime) * decay;
        } else if (elapsedTime < 6.0) {
          // S-Wave
          float t = elapsedTime - 2.0;
          float freq = 4.0;
          float decay = exp(-t * 1.0);
          currentAmplitude = amplitude * 0.6 * sin(2 * PI * freq * t) * decay;
        } else if (elapsedTime < 15.0) {
          // Surface Wave
          float t = elapsedTime - 6.0;
          float freq = 2.0;
          float decay = exp(-t * 0.5);
          currentAmplitude = amplitude * sin(2 * PI * freq * t) * decay;
        }
      }
      break;
      
    case 4: // Con Réplicas
      {
        if (elapsedTime < 15.0) {
          // Sismo principal
          float t = elapsedTime;
          if (t < 2.0) {
            float freq = 8.0;
            float decay = exp(-t * 2.0);
            currentAmplitude = amplitude * 0.3 * sin(2 * PI * freq * t) * decay;
          } else if (t < 6.0) {
            float t2 = t - 2.0;
            float freq = 4.0;
            float decay = exp(-t2 * 1.0);
            currentAmplitude = amplitude * 0.6 * sin(2 * PI * freq * t2) * decay;
          } else {
            float t2 = t - 6.0;
            float freq = 2.0;
            float decay = exp(-t2 * 0.5);
            currentAmplitude = amplitude * sin(2 * PI * freq * t2) * decay;
          }
        } else if (elapsedTime >= 20.0 && elapsedTime < 30.0) {
          // Réplica 1
          float t = elapsedTime - 20.0;
          float freq = 5.0;
          float decay = exp(-t * 1.5);
          currentAmplitude = amplitude * 0.4 * sin(2 * PI * freq * t) * decay;
        } else if (elapsedTime >= 35.0 && elapsedTime < 42.0) {
          // Réplica 2
          float t = elapsedTime - 35.0;
          float freq = 4.0;
          float decay = exp(-t * 2.0);
          currentAmplitude = amplitude * 0.25 * sin(2 * PI * freq * t) * decay;
        }
      }
      break;
      
    case 5: // Sismo Cercano (alta frecuencia)
      {
        float freq = 10.0;
        float attack = min(elapsedTime * 5.0, 1.0);
        float decay = exp(-elapsedTime * 1.5);
        currentAmplitude = amplitude * sin(2 * PI * freq * elapsedTime) * attack * decay;
      }
      break;
      
    case 6: // Sismo Lejano (baja frecuencia)
      {
        float freq = 1.5;
        float attack = min(elapsedTime * 0.5, 1.0);
        float decay = exp(-elapsedTime * 0.3);
        currentAmplitude = amplitude * sin(2 * PI * freq * elapsedTime) * attack * decay;
      }
      break;
      
    default: // Senoidal simple
      currentAmplitude = amplitude * sin(2 * PI * frequency * elapsedTime);
      break;
  }
  
  // Convertir a pasos
  int steps = map(currentAmplitude * 1000, -100000, 100000, -400, 400);
  moveMotor(steps);
  
  if (now - lastUpdateTime > 500) {
    updateStatus();
    lastUpdateTime = now;
    
    Serial.print(F("t="));
    Serial.print(elapsedTime, 1);
    Serial.print(F("s | Amp="));
    Serial.println(currentAmplitude, 2);
  }
}

void moveMotor(int steps) {
  digitalWrite(DIR, steps > 0 ? HIGH : LOW);
  
  int absSteps = abs(steps);
  for (int i = 0; i < absSteps; i++) {
    digitalWrite(STEP, HIGH);
    delayMicroseconds(500);
    digitalWrite(STEP, LOW);
    delayMicroseconds(500);
  }
}

void runRealtimeMode() {
  // Leer amplitud actual de Firebase
  static unsigned long lastRead = 0;
  if (millis() - lastRead < 50) return; // Leer cada 50ms
  lastRead = millis();
  
  String path = "/devices/" + String(DEVICE_ID) + "/realtime";
  
  if (Firebase.RTDB.getJSON(&fbdo, path.c_str())) {
    FirebaseJson &json = fbdo.jsonObject();
    FirebaseJsonData data;
    
    json.get(data, "amplitude");
    if (data.success) {
      float currentAmplitude = data.floatValue;
      
      // Convertir a pasos
      int steps = map(currentAmplitude * 1000, -100000, 100000, -400, 400);
      moveMotor(steps);
      
      // Log ocasional
      static int logCounter = 0;
      if (++logCounter % 20 == 0) {
        Serial.print(F("📊 Amp="));
        Serial.println(currentAmplitude, 2);
      }
    }
  }
}

void updateStatus() {
  String path = "/devices/" + String(DEVICE_ID) + "/status";
  
  float progress = 0;
  if (isRunning) {
    float elapsed = (millis() - startTime) / 1000.0;
    progress = min((elapsed / 60.0) * 100.0, 100.0);
  }
  
  FirebaseJson json;
  json.set("online", true);
  json.set("isRunning", isRunning);
  json.set("progress", progress);
  json.set("lastSeen", (int)timeClient.getEpochTime());
  json.set("currentFrequency", frequency);
  json.set("currentAmplitude", amplitude);
  
  Firebase.RTDB.setJSON(&fbdo, path.c_str(), &json);
}
